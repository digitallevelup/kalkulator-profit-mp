<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <!-- =========================================
       KONFIGURASI
       CUKUP EDIT BAGIAN INI
  ========================================== -->

  <script>
    const APP_NAME = "Kalkulator Profit MP";

    const APP_URL =
      "https://script.google.com/macros/s/AKfycbyf13KhqDd_iSiEDy1m011_KhNnANG8HssqZJB3onQYFXb81qF7QfkTVx-2hK-7KOBuIA/exec";
  </script>

  <title>Kelas Online AI Mastery</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: Arial, sans-serif;
    }

    /* =========================================
       LOADING SCREEN
    ========================================== */

    #loading {
      position: fixed;
      inset: 0;
      z-index: 9999;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #ffffff;

      transition: opacity 0.3s ease;
    }

    .loading-box {
      text-align: center;
      color: #334155;
    }

    .spinner {
      width: 42px;
      height: 42px;

      margin: 0 auto 18px;

      border: 4px solid #e2e8f0;
      border-top-color: #2563eb;

      border-radius: 50%;

      animation: spin 0.8s linear infinite;
    }

    .loading-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .loading-text {
      font-size: 14px;
      color: #64748b;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================================
       APPS SCRIPT IFRAME
    ========================================== */

    #app {
      width: 100%;
      height: 100%;

      border: none;
      display: block;

      opacity: 0;

      transition: opacity 0.4s ease;
    }

    #app.loaded {
      opacity: 1;
    }

    /* =========================================
       FALLBACK
    ========================================== */

    #fallback {
      display: none;

      position: fixed;
      inset: 0;

      align-items: center;
      justify-content: center;

      background: #ffffff;

      text-align: center;

      padding: 30px;
    }

    .fallback-box {
      max-width: 500px;
    }

    .fallback-box h2 {
      margin-bottom: 10px;

      color: #1e293b;
    }

    .fallback-box p {
      color: #64748b;

      line-height: 1.6;
    }

    .fallback-box a {
      display: inline-block;

      margin-top: 15px;

      padding: 12px 20px;

      background: #2563eb;
      color: #ffffff;

      text-decoration: none;

      border-radius: 8px;

      font-weight: 600;
    }

    .fallback-box a:hover {
      background: #1d4ed8;
    }
  </style>
</head>

<body>

  <!-- =========================================
       LOADING
  ========================================== -->

  <div id="loading">

    <div class="loading-box">

      <div class="spinner"></div>

      <div
        class="loading-title"
        id="loadingTitle"
      >
        Memuat aplikasi...
      </div>

      <div class="loading-text">
        Mohon tunggu sebentar
      </div>

    </div>

  </div>


  <!-- =========================================
       GOOGLE APPS SCRIPT
  ========================================== -->

  <iframe
    id="app"
    allow="fullscreen"
    loading="eager"
  ></iframe>


  <!-- =========================================
       FALLBACK
  ========================================== -->

  <div id="fallback">

    <div class="fallback-box">

      <h2 id="fallbackTitle">
        Aplikasi tidak dapat dimuat
      </h2>

      <p>
        Aplikasi tidak dapat ditampilkan melalui halaman ini.
        Silakan buka aplikasi secara langsung.
      </p>

      <a
        id="fallbackLink"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
      >
        Buka Aplikasi
      </a>

    </div>

  </div>


  <!-- =========================================
       JAVASCRIPT
       JANGAN PERLU EDIT
  ========================================== -->

  <script>

    /*
     * Ambil elemen halaman
     */

    const iframe =
      document.getElementById("app");

    const loading =
      document.getElementById("loading");

    const loadingTitle =
      document.getElementById("loadingTitle");

    const fallback =
      document.getElementById("fallback");

    const fallbackTitle =
      document.getElementById("fallbackTitle");

    const fallbackLink =
      document.getElementById("fallbackLink");


    /*
     * Set nama aplikasi
     */

    document.title = APP_NAME;

    loadingTitle.textContent =
      APP_NAME;


    /*
     * Set URL Apps Script
     */

    iframe.src = APP_URL;

    fallbackLink.href = APP_URL;

    fallbackTitle.textContent =
      APP_NAME + " tidak dapat dimuat";


    /*
     * Apps Script berhasil dimuat
     */

    iframe.addEventListener(
      "load",
      function () {

        iframe.classList.add("loaded");

        setTimeout(
          function () {

            loading.style.opacity = "0";

            setTimeout(
              function () {

                loading.style.display =
                  "none";

              },
              300
            );

          },
          300
        );

      }
    );


    /*
     * Jika 10 detik belum berhasil
     */

    setTimeout(
      function () {

        if (
          !iframe.classList.contains("loaded")
        ) {

          loading.style.display =
            "none";

          iframe.style.display =
            "none";

          fallback.style.display =
            "flex";

        }

      },
      10000
    );

  </script>

</body>
</html>
