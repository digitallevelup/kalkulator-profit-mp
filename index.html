<script type="text/babel">

const { useState, useEffect, useMemo } = React;


/* =========================================================
   AUTHENTICATION
========================================================= */

const AUTH_API_URL =
    'https://script.google.com/macros/s/AKfycbyf13KhqDd_iSiEDy1m011_KhNnANG8HssqZJB3onQYFXb81qF7QfkTVx-2hK-7KOBuIA/exec';


const AuthGate = ({ children }) => {

    const [page, setPage] = useState('welcome');
    const [password, setPassword] = useState('');
    const [loading, setLoading] = useState(false);
    const [error, setError] = useState('');

    const verifyPassword = async () => {

        if (!password) {
            setError('Password wajib diisi.');
            return;
        }

        if (!AUTH_API_URL || AUTH_API_URL.includes('PASTE_URL')) {
            setError('URL backend belum diatur.');
            return;
        }

        setLoading(true);
        setError('');

        try {

            const response = await fetch(AUTH_API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8'
                },
                body: JSON.stringify({
                    password
                })
            });

            const result = await response.json();

            if (result.success) {

                sessionStorage.setItem(
                    'profit_mp_authenticated',
                    'true'
                );

                setPage('calculator');
                setPassword('');

            } else {

                setError(result.error || 'Password salah.');

            }

        } catch (err) {

            setError(
                'Tidak dapat terhubung ke server. Coba lagi.'
            );

        } finally {

            setLoading(false);

        }
    };


    useEffect(() => {

        if (
            sessionStorage.getItem(
                'profit_mp_authenticated'
            ) === 'true'
        ) {
            setPage('calculator');
        }

    }, []);


    if (page === 'calculator') {
        return <>{children}</>;
    }


    return (

        <div className="min-h-screen bg-gradient-to-br from-slate-50 via-white to-indigo-50 flex items-center justify-center p-5">

            <div className="w-full max-w-md">

                {page === 'welcome' ? (

                    <div className="bg-white rounded-3xl shadow-xl border border-slate-200 p-7 sm:p-9 text-center">

                        <div className="mx-auto mb-5 w-16 h-16 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center">
                            <i className="fas fa-calculator text-3xl"></i>
                        </div>

                        <h1 className="text-2xl sm:text-3xl font-black text-slate-900">
                            Kalkulator Profit MP
                        </h1>

                        <p className="text-slate-500 mt-3 leading-relaxed">
                            Hitung Harga Jual AKURAT, Supaya UNTUNG Bukan BUNTUNG!
                        </p>

                        <button
                            onClick={() => {
                                setError('');
                                setPage('login');
                            }}
                            className="w-full mt-7 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 px-5 rounded-xl shadow-md transition-all"
                        >
                            Akses Sekarang
                            <i className="fas fa-arrow-right ml-2"></i>
                        </button>

                    </div>

                ) : (

                    <div className="bg-white rounded-3xl shadow-xl border border-slate-200 p-7 sm:p-9">

                        <button
                            onClick={() => {
                                setError('');
                                setPage('welcome');
                            }}
                            className="text-sm text-slate-400 hover:text-indigo-600 mb-5"
                        >
                            <i className="fas fa-arrow-left mr-1"></i>
                            Kembali
                        </button>

                        <div className="text-center">

                            <div className="mx-auto mb-4 w-14 h-14 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center">
                                <i className="fas fa-lock text-2xl"></i>
                            </div>

                            <h2 className="text-2xl font-black text-slate-900">
                                Akses Kalkulator
                            </h2>

                            <p className="text-slate-500 mt-2">
                                Masukkan password untuk melanjutkan.
                            </p>

                        </div>

                        <div className="mt-6">

                            <label className="block text-sm font-semibold text-slate-700 mb-2">
                                Password
                            </label>

                            <div className="relative">

                                <i className="fas fa-key absolute left-3 top-3.5 text-slate-400"></i>

                                <input
                                    type="password"
                                    value={password}
                                    onChange={e => {
                                        setPassword(e.target.value);
                                        setError('');
                                    }}
                                    onKeyDown={e => {
                                        if (e.key === 'Enter' && !loading) {
                                            verifyPassword();
                                        }
                                    }}
                                    placeholder="Masukkan password"
                                    autoComplete="current-password"
                                    className="w-full pl-10 pr-3 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white text-base"
                                />

                            </div>

                            {error && (

                                <div className="mt-3 p-3 rounded-lg bg-red-50 border border-red-100 text-red-600 text-sm font-medium">

                                    <i className="fas fa-exclamation-circle mr-2"></i>

                                    {error}

                                </div>

                            )}

                            <button
                                onClick={verifyPassword}
                                disabled={loading}
                                className="w-full mt-5 bg-indigo-600 hover:bg-indigo-700 disabled:bg-indigo-300 text-white font-bold py-3.5 rounded-xl shadow-md transition-all"
                            >

                                {loading ? (

                                    <>
                                        <i className="fas fa-spinner fa-spin mr-2"></i>
                                        Memeriksa...
                                    </>

                                ) : (

                                    <>
                                        <i className="fas fa-unlock-alt mr-2"></i>
                                        Masuk ke Kalkulator
                                    </>

                                )}

                            </button>

                        </div>

                    </div>

                )}

            </div>

        </div>

    );
};


/* =========================================================
   FORMAT RUPIAH
========================================================= */

const formatRp = (value) => {

    if (
        value === null ||
        value === undefined ||
        value === ''
    ) {
        return '';
    }

    const numberString =
        value.toString().replace(/[^,\d]/g, '');

    const split = numberString.split(',');

    const sisa = split[0].length % 3;

    let rupiah = split[0].substr(0, sisa);

    const ribuan =
        split[0].substr(sisa).match(/\d{3}/gi);

    if (ribuan) {

        const separator = sisa ? '.' : '';

        rupiah +=
            separator +
            ribuan.join('.');

    }

    return split[1] !== undefined
        ? rupiah + ',' + split[1]
        : rupiah;
};


const unformatRp = (value) => {

    if (!value) return 0;

    if (typeof value === 'number') {
        return value;
    }

    return parseInt(
        value.replace(/[^,\d]/g, '') || 0,
        10
    );
};


const formatCurrency = (val) => {

    return new Intl.NumberFormat('id-ID', {

        style: 'currency',
        currency: 'IDR',

        minimumFractionDigits: 0,
        maximumFractionDigits: 0

    }).format(val || 0);

};


/* =========================================================
   CURRENCY INPUT
========================================================= */

const CurrencyInput = ({

}) => (

        <div className="relative shadow-sm rounded-lg">

            <span className="absolute left-3 top-2.5 text-slate-400">

                }

            </span>

            <input
                type="text"
                className={`w-full ${
                    icon ? 'pl-9' : 'pl-10'
                } pr-3 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:bg-white outline-none transition-all text-slate-800 font-medium`}
                value={formatRp(value)}

                    )
                }

    </div>

);


/* =========================================================
   PERCENT INPUT
========================================================= */

const PercentInput = ({
    label,
    value,
    onChange
}) => (

    <div>

        <label className="block text-sm font-semibold text-slate-700 mb-1.5">
            {label}
        </label>

        <div className="relative">

            <input
                type="number"

                }
                placeholder="0"
                className="w-full p-2.5 pr-9 bg-slate-50 border border-slate-200 rounded-lg text-base font-medium outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white text-right"
            />

            <span className="absolute right-3 top-2.5 text-slate-500 text-sm font-bold">
                %
            </span>

        </div>

    </div>

);


/* =========================================================
   CALCULATOR
========================================================= */

function CalculatorApp() {

    const [activeTab, setActiveTab] =
        useState('ideal');


    /* PRODUCT */

    const [productName, setProductName] =
        useState('');


    /* HPP */

    const [hpp, setHpp] =
        useState('');


    /* TARGET PROFIT */

    const [targetProfit, setTargetProfit] =
        useState('');


    /* REAL MODE - CORE PRICE */

    const [sellingPrice, setSellingPrice] =
        useState('');


    /* =====================================================
       DISCOUNT
    ===================================================== */

    const [discountEnabled, setDiscountEnabled] =
        useState(false);

    const [discountPercent, setDiscountPercent] =
        useState('');


    /*
       marketplaceFeeBase:

       'before'
       = fee dihitung dari harga coret

       'after'
       = fee dihitung dari harga setelah diskon
    */

    const [marketplaceFeeBase, setMarketplaceFeeBase] =
        useState('after');


    /* =====================================================
       PERCENTAGE FEES
    ===================================================== */

    const [percentageFees, setPercentageFees] =
        useState([

            {
                id: 1,
                name: 'Biaya Admin',
                value: '10'
            },

            {
                id: 2,
                name: 'Gratis Ongkir Xtra',
                value: '4'
            },

            {
                id: 3,
                name: 'Promo Xtra+',
                value: '4'
            }

        ]);


    /* =====================================================
       NOMINAL FEES
    ===================================================== */

    const [nominalFees, setNominalFees] =
        useState([

            {
                id: 1,
                name: 'Biaya Packing',
                value: '2000'
            },

            {
                id: 2,
                name: 'Biaya Pemrosesan Pesanan',
                value: '1250'
            }

        ]);


    /* =====================================================
       HISTORY
    ===================================================== */

    const [history, setHistory] =
        useState(() => {

            try {

                const savedHistory =
                    localStorage.getItem(
                        'profitCalcHistory'
                    );

                return savedHistory
                    ? JSON.parse(savedHistory)
                    : [];

            } catch (e) {

                return [];

            }

        });


    const [toast, setToast] =
        useState(null);


    useEffect(() => {

        localStorage.setItem(
            'profitCalcHistory',
            JSON.stringify(history)
        );

    }, [history]);


    /* =====================================================
       CALCULATION
    ===================================================== */

    const calcResult = useMemo(() => {

        const numHpp =
            unformatRp(hpp) || 0;


        let totalPct = 0;

        percentageFees.forEach(fee => {

            totalPct +=
                (parseFloat(fee.value) || 0) / 100;

        });


        const totalNom =
            nominalFees.reduce(
                (sum, fee) =>
                    sum +
                    (unformatRp(fee.value) || 0),
                0
            );


        const discount =
            discountEnabled
                ? Math.min(
                    Math.max(
                        parseFloat(discountPercent) || 0,
                        0
                    ),
                    100
                ) / 100
                : 0;


        let corePrice = 0;
        let customerPrice = 0;
        let discountAmount = 0;
        let totalPotongan = 0;
        let finalProfit = 0;

        let isError = false;

        let errorMessage = '';


        /* =================================================
           VALIDATION
        ================================================= */

        if (totalPct >= 1) {

            isError = true;

            errorMessage =
                'Total persentase potongan marketplace harus kurang dari 100%.';

        }


        /*
           Kalau fee setelah diskon dan diskon 100%,
           tidak mungkin ada harga yang bisa menghasilkan profit.
        */

        if (
            !isError &&
            activeTab === 'ideal' &&
            discountEnabled &&
            discount >= 1
        ) {

            isError = true;

            errorMessage =
                'Diskon 100% tidak dapat digunakan untuk mencari harga jual ideal.';

        }


        /* =================================================
           IDEAL MODE
        ================================================= */

        if (!isError && activeTab === 'ideal') {

            const numTarget =
                unformatRp(targetProfit) || 0;


            /*
               Rumus:

               BEFORE DISCOUNT

               Profit =
               Core Price
               - Discount
               - HPP
               - Fee%
               - Nominal

               Core Price =
               (HPP + Target + Nominal)
               /
               (1 - Discount - Fee%)
            */

            if (marketplaceFeeBase === 'before') {

                const denominator =
                    1 -
                    discount -
                    totalPct;


                if (denominator <= 0) {

                    isError = true;

                    errorMessage =
                        'Kombinasi diskon dan potongan marketplace terlalu besar.';

                } else {

                    corePrice =
                        (
                            numHpp +
                            numTarget +
                            totalNom
                        ) /
                        denominator;

                }

            }


            /*
               AFTER DISCOUNT

               Harga customer =
               Core Price × (1 - Discount)

               Fee =
               Harga customer × Fee%

               Profit =
               Harga customer
               - HPP
               - Fee
               - Nominal

               Core Price =
               (HPP + Target + Nominal)
               /
               ((1 - Discount) × (1 - Fee%))
            */

            else {

                const denominator =
                    (1 - discount) *
                    (1 - totalPct);


                if (denominator <= 0) {

                    isError = true;

                    errorMessage =
                        'Kombinasi diskon dan potongan marketplace terlalu besar.';

                } else {

                    corePrice =
                        (
                            numHpp +
                            numTarget +
                            totalNom
                        ) /
                        denominator;

                }

            }


            if (!isError) {

                customerPrice =
                    corePrice *
                    (1 - discount);

                discountAmount =
                    corePrice *
                    discount;


                const feeBase =
                    marketplaceFeeBase === 'before'
                        ? corePrice
                        : customerPrice;


                const percentageAmount =
                    feeBase *
                    totalPct;


                totalPotongan =
                    percentageAmount +
                    totalNom;


                finalProfit =
                    customerPrice -
                    numHpp -
                    totalPotongan;

            }

        }


        /* =================================================
           REAL MODE
        ================================================= */

        else if (!isError) {

            corePrice =
                unformatRp(sellingPrice) || 0;


            customerPrice =
                corePrice *
                (1 - discount);


            discountAmount =
                corePrice *
                discount;


            const feeBase =
                marketplaceFeeBase === 'before'
                    ? corePrice
                    : customerPrice;


            const percentageAmount =
                feeBase *
                totalPct;


            totalPotongan =
                percentageAmount +
                totalNom;


            finalProfit =
                customerPrice -
                numHpp -
                totalPotongan;

        }


        /* =================================================
           BREAKDOWN
        ================================================= */

        let breakdownPct = [];
        let breakdownNom = [];


        if (!isError) {

            const feeBase =
                marketplaceFeeBase === 'before'
                    ? corePrice
                    : customerPrice;


            percentageFees.forEach(fee => {

                const val =
                    parseFloat(fee.value) || 0;


                if (val > 0) {

                    breakdownPct.push({

                        name:
                            fee.name ||
                            'Biaya %',

                        pct: val,

                        amount:
                            feeBase *
                            (val / 100)

                    });

                }

            });


            nominalFees.forEach(fee => {

                const val =
                    unformatRp(fee.value) || 0;


                if (val > 0) {

                    breakdownNom.push({

                        name:
                            fee.name ||
                            'Biaya Tetap',

                        amount: val

                    });

                }

            });

        }


        return {

            corePrice,

            customerPrice,

            discountAmount,

            discountPercent:
                discount * 100,

            sp:
                customerPrice,

            profit:
                finalProfit,

            potongan:
                totalPotongan,

            margin:
                customerPrice > 0
                    ? (
                        finalProfit /
                        customerPrice
                    ) * 100
                    : 0,

            isError,

            errorMessage,

            breakdownPct,

            breakdownNom,

            feeBase:
                marketplaceFeeBase

        };

    }, [

        activeTab,
        hpp,
        targetProfit,
        sellingPrice,

        percentageFees,
        nominalFees,

        discountEnabled,
        discountPercent,
        marketplaceFeeBase

    ]);


    /* =====================================================
       TOAST
    ===================================================== */

    const showToast = (
        text,
        type = 'error'
    ) => {

        setToast({
            text,
            type
        });

        setTimeout(() => {
            setToast(null);
        }, 3000);

    };


    /* =====================================================
       FEE HANDLERS
    ===================================================== */

    const handleUpdatePctFee = (
        id,
        field,
        val
    ) => {

        setPercentageFees(prev =>
            prev.map(fee =>
                fee.id === id
                    ? {
                        ...fee,
                        [field]: val
                    }
                    : fee
            )
        );

    };


    const addPctFee = () => {

        setPercentageFees(prev => [

            ...prev,

            {
                id: Date.now(),
                name: '',
                value: ''
            }

        ]);

    };


    const removePctFee = id => {

        setPercentageFees(prev =>
            prev.filter(
                fee => fee.id !== id
            )
        );

    };


    const handleUpdateNomFee = (
        id,
        field,
        val
    ) => {

        setNominalFees(prev =>
            prev.map(fee =>
                fee.id === id
                    ? {
                        ...fee,
                        [field]: val
                    }
                    : fee
            )
        );

    };


    const addNomFee = () => {

        setNominalFees(prev => [

            ...prev,

            {
                id: Date.now(),
                name: '',
                value: ''
            }

        ]);

    };


    const removeNomFee = id => {

        setNominalFees(prev =>
            prev.filter(
                fee => fee.id !== id
            )
        );

    };


    /* =====================================================
       SAVE
    ===================================================== */

    const handleSave = () => {

        if (
            !productName.trim() ||
            unformatRp(hpp) === 0
        ) {

            showToast(
                'Nama Produk dan Modal (HPP) wajib diisi!',
                'error'
            );

            return;

        }


        if (
            calcResult.isError
        ) {

            showToast(
                calcResult.errorMessage ||
                'Kalkulasi tidak valid.',
                'error'
            );

            return;

        }


        if (
            calcResult.customerPrice <= 0
        ) {

            showToast(
                'Harga jual belum menghasilkan nilai yang valid.',
                'error'
            );

            return;

        }


        const newItem = {

            id: Date.now(),

            name:
                productName,

            mode:
                activeTab,

            hpp:
                unformatRp(hpp),

            corePrice:
                calcResult.corePrice,

            discountEnabled:
                discountEnabled,

            discountPercent:
                calcResult.discountPercent,

            discountAmount:
                calcResult.discountAmount,

            customerPrice:
                calcResult.customerPrice,

            feeBase:
                marketplaceFeeBase,

            potongan:
                calcResult.potongan,

            profit:
                calcResult.profit,

            margin:
                calcResult.margin

        };


        setHistory(prev => [
            newItem,
            ...prev
        ]);


        showToast(
            'Berhasil disimpan ke tabel riwayat!',
            'success'
        );

    };


    /* =====================================================
       STATUS
    ===================================================== */

    const isProfit =
        calcResult.profit > 0;

    const isLoss =
        calcResult.profit < 0;


    return (

        <div className="max-w-6xl mx-auto p-4 md:p-6 lg:p-8 pt-8">


            {/* =================================================
               TOAST
            ================================================= */}

            {toast && (

                <div
                    className={`fixed top-6 right-4 left-4 sm:left-auto sm:right-6 z-50 px-5 py-3 rounded-xl shadow-lg flex items-center gap-3 toast-animation ${
                        toast.type === 'error'
                            ? 'bg-red-600'
                            : 'bg-emerald-600'
                    } text-white`}
                >

                    <i
                        className={`fas ${
                            toast.type === 'error'
                                ? 'fa-exclamation-circle'
                                : 'fa-check-circle'
                        } text-xl`}
                    ></i>

                    <p className="font-medium">
                        {toast.text}
                    </p>

                </div>

            )}


            {/* =================================================
               HEADER
            ================================================= */}

            <header className="mb-8 text-center lg:text-left flex flex-col lg:flex-row items-center justify-between gap-4">

                <div>

                    <h1 className="text-2xl md:text-3xl font-bold text-slate-900 flex items-center gap-3 justify-center lg:justify-start">

                        <i className="fas fa-calculator text-indigo-600"></i>

                        Kalkulator Profit MP

                                </th>

                                <th className="px-5 py-4 font-semibold text-red-500">
                                    Potongan
                                </th>

                                <th className="px-5 py-4 font-semibold text-emerald-600">
                                    Profit
                                </th>

                                <th className="px-5 py-4 font-semibold text-center">
                                    Status
                                </th>

                                <th className="px-5 py-4 font-semibold text-center">
                                    Aksi
                                </th>

                            </tr>

                        </thead>


                        <tbody>

                            {history.length === 0 ? (

                                <tr>

                                    <td
                                        colSpan="9"
                                        className="px-5 py-12 text-center text-slate-400"
                                    >

                                        <i className="fas fa-folder-open text-4xl mb-3 block opacity-50"></i>

                                        Belum ada data kalkulasi yang disimpan.

                                    </td>

                                </tr>

                            ) : (

                                history.map(item => (

                                    <tr
                                        key={item.id}
                                        className="border-b border-slate-100 hover:bg-slate-50/80 transition-colors"
                                    >


                                        {/* NAME */}

                                        <td className="px-5 py-4 font-bold text-slate-800">

                                            {item.name}

                                            <div className="text-[10px] font-normal text-slate-400 mt-0.5 uppercase tracking-wider">

                                                Mode:
                                                {' '}
                                                {item.mode === 'ideal'
                                                    ? 'Hitung Ideal'
                                                    : 'Cek Real'
                                                }

                                            </div>

                                        </td>


                                        {/* HPP */}

                                        <td className="px-5 py-4 text-slate-600">

                                            {formatCurrency(
                                                item.hpp
                                            )}

                                        </td>


                                        {/* CORE */}

                                        <td className="px-5 py-4 font-semibold text-slate-800">

                                            {formatCurrency(
                                                item.corePrice
                                            )}

                                        </td>


                                        {/* DISCOUNT */}

                                        <td className="px-5 py-4">

                                            {item.discountEnabled
                                                ? (
                                                    <div>

                                                        <div className="font-bold text-orange-600">

                                                            {Number(
                                                                item.discountPercent
                                                            ).toFixed(1)}%

                                                        </div>

                                                        <div className="text-[11px] text-slate-400">

                                                            - {formatCurrency(
                                                                item.discountAmount
                                                            )}

                                                        </div>

                                                    </div>
                                                )
                                                : (
                                                    <span className="text-slate-400">
                                                        -
                                                    </span>
                                                )
                                            }

                                        </td>


                                        {/* CUSTOMER PRICE */}

                                        <td className="px-5 py-4 font-semibold text-slate-800">

                                            {formatCurrency(
                                                item.customerPrice
                                            )}

                                        </td>


                                        {/* POTONGAN */}

                                        <td className="px-5 py-4 font-semibold text-red-500">

                                            - {formatCurrency(
                                                item.potongan
                                            )}

                                        </td>


                                        {/* PROFIT */}

                                        <td className="px-5 py-4">

                                            <div
                                                className={`font-black ${
                                                    item.profit > 0
                                                        ? 'text-emerald-500'
                                                        : 'text-red-500'
                                                }`}
                                            >

                                                {formatCurrency(
                                                    item.profit
                                                )}

                                            </div>

                                            <div className="text-[11px] font-medium text-slate-400 mt-0.5">

                                                Margin:
                                                {' '}
                                                {Number(
                                                    item.margin || 0
                                                ).toFixed(1)}%

                                            </div>

                                        </td>


                                        {/* STATUS */}

                                        <td className="px-5 py-4 text-center">

                                            <span
                                                className={`px-3 py-1.5 text-[10px] font-bold rounded-lg uppercase tracking-wide ${
                                                    item.profit > 0
                                                        ? 'bg-emerald-100 text-emerald-700'
                                                        : item.profit < 0
                                                            ? 'bg-red-100 text-red-700'
                                                            : 'bg-slate-100 text-slate-600'
                                                }`}
                                            >

                                                {item.profit > 0
                                                    ? 'UNTUNG'
                                                    : item.profit < 0
                                                        ? 'BUNTUNG'
                                                        : 'IMPAS'
                                                }

                                            </span>

                                        </td>


                                        {/* DELETE */}

                                        <td className="px-5 py-4 text-center">

                                            <button
                                                onClick={() =>
                                                    setHistory(prev =>
                                                        prev.filter(
                                                            h =>
                                                                h.id !==
                                                                item.id
                                                        )
                                                    )
                                                }
                                                className="w-8 h-8 rounded-full bg-slate-100 text-slate-400 hover:bg-red-100 hover:text-red-600 transition-colors flex items-center justify-center mx-auto"
                                                title="Hapus"
                                            >

                                                <i className="fas fa-trash-alt text-xs"></i>

                                            </button>

                                        </td>

                                    </tr>

                                ))

                            )}

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    );

}


/* =========================================================
   RENDER
========================================================= */

const root =
    ReactDOM.createRoot(
        document.getElementById('root')
    );


root.render(
    <AuthGate>
        <CalculatorApp />
    </AuthGate>
);

</script>

</body>
</html>
