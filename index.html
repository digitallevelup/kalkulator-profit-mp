<script type="text/babel">

const {
    useState,
    useEffect,
    useMemo
} = React;


/* =========================================================
   BACKEND AUTHENTICATION
========================================================= */

const AUTH_API_URL =
    'https://script.google.com/macros/s/AKfycbyf13KhqDd_iSiEDy1m011_KhNnANG8HssqZJB3onQYFXb81qF7QfkTVx-2hK-7KOBuIA/exec';


/* =========================================================
   HELPER
========================================================= */

const formatRp = (value) => {
    if (
        value === null ||
        value === undefined ||
        value === ''
    ) {
        return '';
    }

    const numberString = value
        .toString()
        .replace(/[^,\d]/g, '');

    const split = numberString.split(',');

    const sisa = split[0].length % 3;

    let rupiah = split[0].substr(0, sisa);

    const ribuan = split[0]
        .substr(sisa)
        .match(/\d{3}/gi);

    if (ribuan) {
        const separator = sisa ? '.' : '';
        rupiah += separator + ribuan.join('.');
    }

    return split[1] !== undefined
        ? rupiah + ',' + split[1]
        : rupiah;
};


const unformatRp = (value) => {
    if (
        value === null ||
        value === undefined ||
        value === ''
    ) {
        return 0;
    }

    if (typeof value === 'number') {
        return value;
    }

    return parseInt(
        value.replace(/[^,\d]/g, '') || 0,
        10
    );
};


const formatCurrency = (value) => {
    return new Intl.NumberFormat('id-ID', {
        style: 'currency',
        currency: 'IDR',
        minimumFractionDigits: 0,
        maximumFractionDigits: 0
    }).format(Number(value) || 0);
};


/* =========================================================
   AUTH GATE
========================================================= */

const AuthGate = ({ children }) => {

    const [page, setPage] = useState('welcome');
    const [password, setPassword] = useState('');
    const [loading, setLoading] = useState(false);
    const [error, setError] = useState('');


    const verifyPassword = async () => {

        if (!password) {
            setError('Password wajib diisi.');
            return;
        }

        if (
            !AUTH_API_URL ||
            AUTH_API_URL.includes('PASTE_URL')
        ) {
            setError('URL backend belum diatur.');
            return;
        }

        setLoading(true);
        setError('');

        try {

            const response = await fetch(
                AUTH_API_URL,
                {
                    method: 'POST',
                    headers: {
                        'Content-Type':
                            'text/plain;charset=utf-8'
                    },
                    body: JSON.stringify({
                        password: password
                    })
                }
            );

            const result = await response.json();

            if (result.success) {

                sessionStorage.setItem(
                    'profit_mp_authenticated',
                    'true'
                );

                setPassword('');
                setPage('calculator');

            } else {

                setError(
                    result.error ||
                    'Password salah.'
                );
            }

        } catch (err) {

            console.error(err);

            setError(
                'Tidak dapat terhubung ke server. Coba lagi.'
            );

        } finally {

            setLoading(false);

        }
    };


    useEffect(() => {

        try {

            if (
                sessionStorage.getItem(
                    'profit_mp_authenticated'
                ) === 'true'
            ) {
                setPage('calculator');
            }

        } catch (err) {
            console.error(err);
        }

    }, []);


    if (page === 'calculator') {
        return <>{children}</>;
    }


    return (
        <div className="min-h-screen bg-gradient-to-br from-slate-50 via-white to-indigo-50 flex items-center justify-center p-4 sm:p-5">

            <div className="w-full max-w-md">

                {page === 'welcome' ? (

                    <div className="bg-white rounded-3xl shadow-xl border border-slate-200 p-6 sm:p-9 text-center">

                        <div className="mx-auto mb-5 w-16 h-16 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center">
                            <i className="fas fa-calculator text-3xl"></i>
                        </div>

                        <h1 className="text-2xl sm:text-3xl font-black text-slate-900">
                            Kalkulator Profit MP
                        </h1>

                        <p className="text-slate-500 mt-3 leading-relaxed">
                            Hitung Harga Jual AKURAT,
                            Supaya UNTUNG Bukan BUNTUNG!
                        </p>

                        <button
                            type="button"
                            onClick={() => {
                                setError('');
                                setPage('login');
                            }}
                            className="w-full mt-7 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 px-5 rounded-xl shadow-md transition-all"
                        >
                            Akses Sekarang
                            <i className="fas fa-arrow-right ml-2"></i>
                        </button>

                    </div>

                ) : (

                    <div className="bg-white rounded-3xl shadow-xl border border-slate-200 p-6 sm:p-9">

                        <button
                            type="button"
                            onClick={() => {
                                setError('');
                                setPage('welcome');
                            }}
                            className="text-sm text-slate-400 hover:text-indigo-600 mb-5"
                        >
                            <i className="fas fa-arrow-left mr-1"></i>
                            Kembali
                        </button>

                        <div className="text-center">

                            <div className="mx-auto mb-4 w-14 h-14 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center">
                                <i className="fas fa-lock text-2xl"></i>
                            </div>

                            <h2 className="text-2xl font-black text-slate-900">
                                Akses Kalkulator
                            </h2>

                            <p className="text-slate-500 mt-2">
                                Masukkan password untuk melanjutkan.
                            </p>

                        </div>

                        <div className="mt-6">

                            <label className="block text-sm font-semibold text-slate-700 mb-2">
                                Password
                            </label>

                            <div className="relative">

                                <i className="fas fa-key absolute left-3 top-3.5 text-slate-400"></i>

                                <input
                                    type="password"
                                    value={password}
                                    onChange={(e) => {
                                        setPassword(e.target.value);
                                        setError('');
                                    }}
                                    onKeyDown={(e) => {
                                        if (
                                            e.key === 'Enter' &&
                                            !loading
                                        ) {
                                            verifyPassword();
                                        }
                                    }}
                                    placeholder="Masukkan password"
                                    autoComplete="current-password"
                                    className="w-full pl-10 pr-3 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white text-base"
                                />

                            </div>

                            {error && (

                                <div className="mt-3 p-3 rounded-lg bg-red-50 border border-red-100 text-red-600 text-sm font-medium">

                                    <i className="fas fa-exclamation-circle mr-2"></i>

                                    {error}

                                </div>

                            )}

                            <button
                                type="button"
                                onClick={verifyPassword}
                                disabled={loading}
                                className="w-full mt-5 bg-indigo-600 hover:bg-indigo-700 disabled:bg-indigo-300 text-white font-bold py-3.5 rounded-xl shadow-md transition-all"
                            >

                                {loading ? (

                                    <>
                                        <i className="fas fa-spinner fa-spin mr-2"></i>
                                        Memeriksa...
                                    </>

                                ) : (

                                    <>
                                        <i className="fas fa-unlock-alt mr-2"></i>
                                        Masuk ke Kalkulator
                                    </>

                                )}

                            </button>

                        </div>

                    </div>

                )}

            </div>

        </div>
    );
};


/* =========================================================
   CURRENCY INPUT
========================================================= */

const CurrencyInput = ({
    label,
    value,
    onChange,
    placeholder,
    icon
}) => (

    <div className="mb-1">

        <label className="block text-sm font-semibold text-slate-700 mb-1.5">
            {label}
        </label>

        <div className="relative shadow-sm rounded-lg">

            <span className="absolute left-3 top-2.5 text-slate-400">
                {icon
                    ? <i className={icon}></i>
                    : 'Rp'
                }
            </span>

            <input
                type="text"
                inputMode="numeric"
                className={`w-full ${
                    icon ? 'pl-9' : 'pl-10'
                } pr-3 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:bg-white outline-none transition-all text-slate-800 font-medium`}
                value={formatRp(value)}
                onChange={(e) =>
                    onChange(
                        unformatRp(
                            e.target.value
                        )
                    )
                }
                placeholder={placeholder}
            />

        </div>

    </div>
);


/* =========================================================
   CALCULATOR
========================================================= */

function CalculatorApp() {

    const [activeTab, setActiveTab] =
        useState('ideal');

    const [productName, setProductName] =
        useState('');

    const [hpp, setHpp] =
        useState('');

    const [targetProfit, setTargetProfit] =
        useState('');

    // Target profit bisa dalam Rupiah atau Margin (%)
    const [targetProfitType, setTargetProfitType] =
        useState('rupiah');

    const [sellingPrice, setSellingPrice] =
        useState('');


    /* ============================
       DISCOUNT
    ============================ */

    const [discountEnabled, setDiscountEnabled] =
        useState(false);

    const [discountPercent, setDiscountPercent] =
        useState('');

    const [discountBase, setDiscountBase] =
        useState('after');


    /* ============================
       PERCENTAGE FEES
    ============================ */

    const [percentageFees, setPercentageFees] =
        useState([
            {
                id: 1,
                name: 'Biaya Admin',
                value: '10'
            },
            {
                id: 2,
                name: 'Gratis Ongkir Xtra',
                value: '4'
            },
            {
                id: 3,
                name: 'Promo Xtra+',
                value: '4'
            }
        ]);


    /* ============================
       NOMINAL FEES
    ============================ */

    const [nominalFees, setNominalFees] =
        useState([
            {
                id: 1,
                name: 'Biaya Packing',
                value: '2000'
            },
            {
                id: 2,
                name: 'Biaya Pemrosesan Pesanan',
                value: '1250'
            }
        ]);


    /* ============================
       HISTORY
    ============================ */

    const [history, setHistory] =
        useState(() => {

            try {

                const saved =
                    localStorage.getItem(
                        'profitCalcHistory'
                    );

                return saved
                    ? JSON.parse(saved)
                    : [];

            } catch (err) {

                console.error(err);
                return [];

            }

        });


    const [toast, setToast] =
        useState(null);


    useEffect(() => {

        try {

            localStorage.setItem(
                'profitCalcHistory',
                JSON.stringify(history)
            );

        } catch (err) {

            console.error(err);

        }

    }, [history]);


    /* =========================================================
       CALCULATION
    ========================================================= */

    const calcResult = useMemo(() => {

        const numHpp =
            unformatRp(hpp) || 0;

        const numTargetInput =
            targetProfitType === 'percent'
                ? (parseFloat(targetProfit) || 0)
                : (unformatRp(targetProfit) || 0);

        const numSellingPrice =
            unformatRp(sellingPrice) || 0;


        let totalPct = 0;

        percentageFees.forEach((fee) => {

            totalPct +=
                (parseFloat(fee.value) || 0) / 100;

        });


        const totalNom =
            nominalFees.reduce(
                (sum, fee) =>
                    sum +
                    (unformatRp(fee.value) || 0),
                0
            );


        let discount =
            discountEnabled
                ? Math.max(
                    0,
                    Math.min(
                        99.99,
                        parseFloat(
                            discountPercent
                        ) || 0
                    )
                ) / 100
                : 0;


        let finalPriceBeforeDiscount = 0;
        let finalSellingPrice = 0;
        let totalPotongan = 0;
        let finalProfit = 0;

        let isError = false;

        let errorMessage = '';

        let breakdownPct = [];

        let breakdownNom = [];


        /* ============================================
           VALIDASI
        ============================================ */

        if (totalPct >= 1) {

            isError = true;

            errorMessage =
                'Total persentase potongan melebihi atau sama dengan 100%.';

        }


        if (
            discountEnabled &&
            discount >= 1
        ) {

            isError = true;

            errorMessage =
                'Diskon tidak boleh 100% atau lebih.';

        }


        /* ============================================
           MODE IDEAL
        ============================================ */

        if (
            !isError &&
            activeTab === 'ideal'
        ) {

            /*
                Rumus:

                Jika potongan marketplace
                dihitung SEBELUM diskon:

                Net =
                Harga Coret
                - Diskon
                - Potongan Marketplace
                - Biaya Nominal
                - HPP

                Harga Coret =
                (HPP + Target Profit + Biaya Nominal)
                /
                (1 - Diskon - Total %)
            */


            if (discountBase === 'before') {

                const targetMargin =
                    targetProfitType === 'percent'
                        ? Math.max(0, Math.min(99.99, numTargetInput)) / 100
                        : 0;

                const denominator =
                    1 -
                    discount -
                    totalPct -
                    targetMargin;


                if (denominator <= 0) {

                    isError = true;

                    errorMessage =
                        'Diskon + total potongan persentase terlalu besar.';

                } else {

                    finalPriceBeforeDiscount =
                        (
                            numHpp +
                            (targetProfitType === 'rupiah' ? numTargetInput : 0) +
                            totalNom
                        ) /
                        denominator;

                }

            } else {

                /*
                    Jika potongan dihitung
                    SETELAH diskon:

                    Harga setelah diskon =
                    Harga Coret × (1 - Diskon)

                    Potongan =
                    Harga Setelah Diskon × %

                    Harga Coret =
                    (HPP + Target + Nominal)
                    /
                    ((1 - Diskon) × (1 - %))
                */


                const targetMargin =
                    targetProfitType === 'percent'
                        ? Math.max(0, Math.min(99.99, numTargetInput)) / 100
                        : 0;

                const denominator =
                    (1 - discount) *
                    (1 - totalPct - targetMargin);


                if (denominator <= 0) {

                    isError = true;

                    errorMessage =
                        'Diskon atau total potongan persentase terlalu besar.';

                } else {

                    finalPriceBeforeDiscount =
                        (
                            numHpp +
                            (targetProfitType === 'rupiah' ? numTargetInput : 0) +
                            totalNom
                        ) /
                        denominator;

                }

            }


            if (!isError) {

                finalSellingPrice =
                    finalPriceBeforeDiscount *
                    (1 - discount);


                /* Diskon */

                const discountAmount =
                    finalPriceBeforeDiscount *
                    discount;


                /* Potongan marketplace */

                percentageFees.forEach((fee) => {

                    const pct =
                        parseFloat(
                            fee.value
                        ) || 0;

                    if (pct > 0) {

                        let basePrice =
                            discountBase === 'after'
                                ? finalSellingPrice
                                : finalPriceBeforeDiscount;

                        breakdownPct.push({
                            name:
                                fee.name ||
                                'Biaya %',

                            pct: pct,

                            amount:
                                basePrice *
                                (pct / 100)
                        });

                    }

                });


                /* Biaya nominal */

                nominalFees.forEach((fee) => {

                    const value =
                        unformatRp(
                            fee.value
                        ) || 0;

                    if (value > 0) {

                        breakdownNom.push({
                            name:
                                fee.name ||
                                'Biaya Tetap',

                            amount: value
                        });

                    }

                });


                totalPotongan =
                    discountAmount +
                    breakdownPct.reduce(
                        (sum, item) =>
                            sum + item.amount,
                        0
                    ) +
                    totalNom;


                finalProfit =
                    finalSellingPrice -
                    numHpp -
                    (
                        breakdownPct.reduce(
                            (sum, item) =>
                                sum + item.amount,
                            0
                        ) +
                        totalNom
                    );

            }

        }


        /* ============================================
           MODE REAL
        ============================================ */

        if (
            !isError &&
            activeTab === 'real'
        ) {

            /*
                Cek Real Profit.
                Jika diskon aktif, harga jual yang dimasukkan
                dianggap sebagai harga coret dan transaksi aktual
                dihitung dari harga setelah diskon.
            */

            finalPriceBeforeDiscount =
                numSellingPrice;

            finalSellingPrice =
                discountEnabled
                    ? finalPriceBeforeDiscount * (1 - discount)
                    : finalPriceBeforeDiscount;

            const discountAmount =
                finalPriceBeforeDiscount * discount;


            percentageFees.forEach((fee) => {

                const pct =
                    parseFloat(
                        fee.value
                    ) || 0;

                if (pct > 0) {

                    breakdownPct.push({
                        name:
                            fee.name ||
                            'Biaya %',

                        pct: pct,

                        amount:
                            (discountEnabled && discountBase === 'before'
                                ? finalPriceBeforeDiscount
                                : finalSellingPrice) *
                            (pct / 100)
                    });

                }

            });


            nominalFees.forEach((fee) => {

                const value =
                    unformatRp(
                        fee.value
                    ) || 0;

                if (value > 0) {

                    breakdownNom.push({
                        name:
                            fee.name ||
                            'Biaya Tetap',

                        amount: value
                    });

                }

            });


            const totalPercentageAmount =
                breakdownPct.reduce(
                    (sum, item) =>
                        sum + item.amount,
                    0
                );


            totalPotongan =
                discountAmount +
                totalPercentageAmount +
                totalNom;


            finalProfit =
                finalSellingPrice -
                numHpp -
                totalPercentageAmount -
                totalNom;

        }


        const margin =
            finalSellingPrice > 0
                ? (
                    finalProfit /
                    finalSellingPrice
                ) * 100
                : 0;


        return {

            priceBeforeDiscount:
                finalPriceBeforeDiscount,

            sellingPrice:
                finalSellingPrice,

            sp:
                finalSellingPrice,

            discountAmount:
                finalPriceBeforeDiscount *
                discount,

            profit:
                finalProfit,

            potongan:
                totalPotongan,

            margin:
                margin,

            isError:
                isError,

            errorMessage:
                errorMessage,

            discount:
                discount * 100,

            breakdownPct:
                breakdownPct,

            breakdownNom:
                breakdownNom

        };

    }, [
        activeTab,
        hpp,
        targetProfit,
        targetProfitType,
        sellingPrice,
        percentageFees,
        nominalFees,
        discountEnabled,
        discountPercent,
        discountBase
    ]);


    /* =========================================================
       TOAST
    ========================================================= */

    const showToast = (
        text,
        type = 'error'
    ) => {

        setToast({
            text: text,
            type: type
        });

        setTimeout(() => {
            setToast(null);
        }, 3000);

    };


    /* =========================================================
       FEE HANDLERS
    ========================================================= */

    const handleUpdatePctFee = (
        id,
        field,
        value
    ) => {

        setPercentageFees(
            prev =>
                prev.map(fee =>
                    fee.id === id
                        ? {
                            ...fee,
                            [field]: value
                        }
                        : fee
                )
        );

    };


    const addPctFee = () => {

        setPercentageFees(
            prev => [
                ...prev,
                {
                    id:
                        Date.now(),
                    name: '',
                    value: ''
                }
            ]
        );

    };


    const removePctFee = (id) => {

        setPercentageFees(
            prev =>
                prev.filter(
                    fee => fee.id !== id
                )
        );

    };


    const handleUpdateNomFee = (
        id,
        field,
        value
    ) => {

        setNominalFees(
            prev =>
                prev.map(fee =>
                    fee.id === id
                        ? {
                            ...fee,
                            [field]: value
                        }
                        : fee
                )
        );

    };


    const addNomFee = () => {

        setNominalFees(
            prev => [
                ...prev,
                {
                    id:
                        Date.now(),
                    name: '',
                    value: ''
                }
            ]
        );

    };


    const removeNomFee = (id) => {

        setNominalFees(
            prev =>
                prev.filter(
                    fee => fee.id !== id
                )
        );

    };


    /* =========================================================
       SAVE
    ========================================================= */

    const handleSave = () => {

        if (
            !productName.trim() ||
            unformatRp(hpp) === 0
        ) {

            showToast(
                'Nama Produk dan Modal (HPP) wajib diisi!',
                'error'
            );

            return;
        }


        if (calcResult.isError) {

            showToast(
                'Gagal menyimpan: ' +
                calcResult.errorMessage,
                'error'
            );

            return;
        }


        if (
            activeTab === 'real' &&
            unformatRp(sellingPrice) === 0
        ) {

            showToast(
                'Harga Jual Saat Ini wajib diisi!',
                'error'
            );

            return;
        }


        const newItem = {

            id:
                Date.now(),

            name:
                productName,

            mode:
                activeTab,

            hpp:
                unformatRp(hpp),

            targetProfitType:
                targetProfitType,

            targetProfit:
                targetProfitType === 'percent'
                    ? (parseFloat(targetProfit) || 0)
                    : unformatRp(targetProfit),

            sp:
                calcResult.sp,

            priceBeforeDiscount:
                calcResult.priceBeforeDiscount,

            discount:
                calcResult.discount,

            discountBase:
                discountEnabled
                    ? discountBase
                    : null,

            potongan:
                calcResult.potongan,

            profit:
                calcResult.profit,

            margin:
                calcResult.margin

        };


        setHistory(
            prev => [
                newItem,
                ...prev
            ]
        );


        showToast(
            'Berhasil disimpan ke tabel riwayat!',
            'success'
        );

    };


    /* =========================================================
       DOWNLOAD HISTORY
    ========================================================= */

    const handleDownloadHistory = () => {

        if (history.length === 0) {
            showToast('Belum ada riwayat yang bisa diunduh.', 'error');
            return;
        }

        const headers = [
            'Nama Produk', 'Mode', 'HPP', 'Harga Jual', 'Harga Coret',
            'Diskon (%)', 'Basis Potongan', 'Total Potongan',
            'Profit Bersih', 'Margin (%)'
        ];

        const xmlEscape = value => {
            const text = value == null ? '' : String(value);
            return text.replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&apos;');
        };

        const cell = value =>
            '<Cell><Data ss:Type="String">' +
            xmlEscape(value) +
            '</Data></Cell>';

        const headerRow = '<Row>' + headers.map(cell).join('') + '</Row>';

        const rows = history.map(item => [
            item.name,
            item.mode === 'ideal' ? 'Hitung Ideal' : 'Cek Real',
            item.hpp,
            item.sp,
            item.priceBeforeDiscount,
            Number(item.discount || 0).toFixed(1),
            item.discountBase === 'before' ? 'Sebelum Diskon' :
                item.discountBase === 'after' ? 'Setelah Diskon' : '',
            item.potongan,
            item.profit,
            Number(item.margin || 0).toFixed(2)
        ]);

        const bodyRows = rows.map(row =>
            '<Row>' + row.map(cell).join('') + '</Row>'
        ).join('');

        // Excel 97-2003 compatible SpreadsheetML workbook (.xls)
        const excelXml = '<?xml version="1.0"?>' +
            '<?mso-application progid="Excel.Sheet"?>' +
            '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" ' +
            'xmlns:o="urn:schemas-microsoft-com:office:office" ' +
            'xmlns:x="urn:schemas-microsoft-com:office:excel" ' +
            'xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet" ' +
            'xmlns:html="http://www.w3.org/TR/REC-html40">' +
            '<Worksheet ss:Name="Riwayat Kalkulasi"><Table>' +
            headerRow + bodyRows +
            '</Table></Worksheet></Workbook>';

        const blob = new Blob(['\uFEFF' + excelXml], {
            type: 'application/vnd.ms-excel'
        });

        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'riwayat-kalkulasi-profit-mp-' +
            new Date().toISOString().slice(0, 10) + '.xls';

        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        setTimeout(() => URL.revokeObjectURL(url), 100);

        showToast('Riwayat berhasil diunduh dalam format Excel (.xls).', 'success');
    };

       STATUS
    ========================================================= */

                                        </div>

                                    )}


                                    {/* HPP */}

                                    <div className="flex justify-between px-2">

                                        <span className="text-slate-500">
                                            Modal (HPP)
                                        </span>

                                        <span className="font-medium text-slate-700">
                                            - {formatCurrency(
                                                unformatRp(hpp)
                                            )}
                                        </span>

                                    </div>


                                    {/* BREAKDOWN */}

                                    <div className="mt-2 bg-slate-100/50 p-2.5 rounded-lg border border-slate-200">

                                        <div className="text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">
                                            Rincian Potongan
                                        </div>


                                        {/* PERCENTAGE */}

                                        {calcResult.breakdownPct.map(
                                            (item, index) => (

                                                <div
                                                    key={'pct-' + index}
                                                    className="flex justify-between text-xs py-0.5 gap-2"
                                                >

                                                    <span className="text-red-400 truncate">

                                                        ↳ {item.name}
                                                        {' '}
                                                        ({item.pct}%)

                                                    </span>

                                                    <span className="text-red-500 shrink-0">

                                                        - {formatCurrency(
                                                            item.amount
                                                        )}

                                                    </span>

                                                </div>

                                            )
                                        )}


                                        {/* NOMINAL */}

                                        {calcResult.breakdownNom.map(
                                            (item, index) => (

                                                <div
                                                    key={'nom-' + index}
                                                    className="flex justify-between text-xs py-0.5 gap-2"
                                                >

                                                    <span className="text-red-400 truncate">
                                                        ↳ {item.name}
                                                    </span>

                                                    <span className="text-red-500 shrink-0">
                                                        - {formatCurrency(
                                                            item.amount
                                                        )}
                                                    </span>

                                                </div>

                                            )
                                        )}


                                        <div className="flex justify-between pt-1.5 mt-1.5 border-t border-slate-200 border-dashed">

                                            <span className="text-slate-600 font-semibold text-xs">
                                                Total Semua Potongan
                                            </span>

                                            <span className="font-bold text-red-500 text-sm">
                                                - {formatCurrency(
                                                    calcResult.potongan
                                                )}
                                            </span>

                                        </div>

                                    </div>


                                    {/* PROFIT */}

                                    <div className="pt-4 mt-2 border-t border-slate-100">

                                        <div className="flex justify-between items-end mb-1 gap-3">

                                            <span className="font-bold text-slate-800 text-base">
                                                Profit Bersih
                                            </span>

                                            <div
                                                className={`text-xl sm:text-2xl font-black text-right ${
                                                    isProfit
                                                        ? 'text-emerald-500'
                                                        : isLoss
                                                            ? 'text-red-500'
                                                            : 'text-slate-800'
                                                }`}
                                            >
                                                {formatCurrency(
                                                    calcResult.profit
                                                )}
                                            </div>

                                        </div>


                                        <div className="flex justify-between items-center text-xs">

                                            <span className="text-slate-400">
                                                Margin dari Harga Jual:
                                            </span>

                                            <span
                                                className={`font-semibold ${
                                                    isProfit
                                                        ? 'text-emerald-600'
                                                        : 'text-slate-500'
                                                }`}
                                            >
                                                {calcResult.margin.toFixed(2)}%
                                            </span>

                                        </div>

                                    </div>

                                </div>

                            )}


                            {/* SAVE */}

                            <button
                                type="button"
                                onClick={handleSave}
                                disabled={calcResult.isError}
                                className={`w-full mt-6 font-bold py-3 px-4 rounded-xl shadow-md transition-all flex items-center justify-center gap-2 ${
                                    calcResult.isError
                                        ? 'bg-slate-300 text-slate-500 cursor-not-allowed'
                                        : 'bg-indigo-600 hover:bg-indigo-700 text-white hover:shadow-lg'
                                }`}
                            >

                                <i className="fas fa-save"></i>

                                Simpan ke Riwayat

                            </button>

                        </div>


                        {/* TIPS */}

                        <div className="mt-4 p-4 bg-blue-50 text-blue-800 text-xs rounded-xl border border-blue-100 shadow-sm leading-relaxed">

                            <i className="fas fa-info-circle mr-1"></i>

                            <b>Tips:</b>

                            {' '}

                            Pastikan % potongan sesuai dengan kategori produk Anda di aplikasi seller centre seperti Shopee/TikTok.

                        </div>

                    </div>

                </div>

            </div>


            {/* =================================================
               HISTORY
            ================================================= */}

            <div className="mt-7 sm:mt-10 bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">

                <div className="p-3 sm:p-5 border-b border-slate-100 flex items-center justify-between gap-2 bg-slate-50/50">

                    <h3 className="font-bold text-slate-800 text-sm sm:text-lg shrink-0 whitespace-nowrap">

                        <i className="fas fa-history mr-1.5 sm:mr-2 text-indigo-500"></i>

                        <span className="sm:hidden">Riwayat</span>
                        <span className="hidden sm:inline">Riwayat Kalkulasi</span>

                    </h3>

                    <div className="flex items-center justify-end gap-1.5 sm:gap-2 shrink-0">

                        <button
                            type="button"
                            onClick={handleDownloadHistory}
                            className="bg-emerald-50 text-emerald-500 hover:bg-emerald-100 border border-emerald-200 w-9 h-9 sm:w-auto sm:h-auto sm:px-3 sm:py-2 rounded-lg transition-colors flex items-center justify-center sm:gap-1.5"
                            title="Download riwayat sebagai Excel (.xls)"
                        >
                            <i className="fas fa-download"></i>
                            <span className="hidden sm:inline">Excel</span>
                        </button>

                        <span className="bg-indigo-100 text-indigo-700 text-xs font-bold px-2.5 py-2 rounded-full inline-flex items-center justify-center whitespace-nowrap shrink-0 w-auto min-w-max leading-none">
                            {history.length} Produk
                        </span>

                    </div>

                </div>


                <div className="overflow-x-auto custom-scrollbar">

                    <table className="w-full text-sm text-left whitespace-nowrap">

                        <thead className="text-xs text-slate-500 uppercase bg-slate-50 border-b border-slate-200">

                            <tr>

                                <th className="px-5 py-4 font-semibold">
                                    Nama Produk
                                </th>

                                <th className="px-5 py-4 font-semibold">
                                    Modal (HPP)
                                </th>

                                <th className="px-5 py-4 font-semibold">
                                    Harga Jual
                                </th>

                                <th className="px-5 py-4 font-semibold text-red-500">
                                    Total Potongan
                                </th>

                                <th className="px-5 py-4 font-semibold text-emerald-600">
                                    Profit Bersih
                                </th>

                                <th className="px-5 py-4 font-semibold text-center">
                                    Status
                                </th>

                                <th className="px-5 py-4 font-semibold text-center">
                                    Aksi
                                </th>

                            </tr>

                        </thead>


                        <tbody>

                            {history.length === 0 ? (

                                <tr>

                                    <td
                                        colSpan="7"
                                        className="px-5 py-12 text-center text-slate-400"
                                    >

                                        <i className="fas fa-folder-open text-4xl mb-3 block opacity-50"></i>

                                        Belum ada data kalkulasi yang disimpan.

                                    </td>

                                </tr>

                            ) : (

                                history.map(item => (

                                    <tr
                                        key={item.id}
                                        className="border-b border-slate-100 hover:bg-slate-50/80 transition-colors"
                                    >

                                        <td className="px-5 py-4 font-bold text-slate-800">

                                            {item.name}

                                            <div className="text-[10px] font-normal text-slate-400 mt-0.5 uppercase tracking-wider">

                                                Mode:

                                                {' '}

                                                {item.mode === 'ideal'
                                                    ? 'Hitung Ideal'
                                                    : 'Cek Real'
                                                }

                                                {item.discount > 0 && (
                                                    <>
                                                        {' • '}
                                                        Diskon {Number(item.discount).toFixed(1)}%
                                                    </>
                                                )}

                                            </div>

                                        </td>


                                        <td className="px-5 py-4 text-slate-600">
                                            {formatCurrency(item.hpp)}
                                        </td>


                                        <td className="px-5 py-4 font-semibold text-slate-800">

                                            {formatCurrency(item.sp)}

                                            {item.mode === 'ideal' &&
                                            item.discount > 0 && (

                                                <div className="text-[10px] text-slate-400 line-through mt-0.5">
                                                    {formatCurrency(
                                                        item.priceBeforeDiscount
                                                    )}
                                                </div>

                                            )}

                                        </td>


                                        <td className="px-5 py-4 font-semibold text-red-500">

                                            - {formatCurrency(
                                                item.potongan
                                            )}

                                        </td>


                                        <td className="px-5 py-4">

                                            <div
                                                className={`font-black ${
                                                    item.profit > 0
                                                        ? 'text-emerald-500'
                                                        : 'text-red-500'
                                                }`}
                                            >

                                                {formatCurrency(
                                                    item.profit
                                                )}

                                            </div>

                                            <div className="text-[11px] font-medium text-slate-400 mt-0.5">

                                                Margin:
                                                {' '}
                                                {Number(
                                                    item.margin
                                                ).toFixed(1)}%

                                            </div>

                                        </td>


                                        <td className="px-5 py-4 text-center">

                                            <span
                                                className={`px-3 py-1.5 text-[10px] font-bold rounded-lg uppercase tracking-wide ${
                                                    item.profit > 0
                                                        ? 'bg-emerald-100 text-emerald-700'
                                                        : 'bg-red-100 text-red-700'
                                                }`}
                                            >

                                                {item.profit > 0
                                                    ? 'UNTUNG'
                                                    : 'BUNTUNG'
                                                }

                                            </span>

                                        </td>


                                        <td className="px-5 py-4 text-center">

                                            <button
                                                type="button"
                                                onClick={() =>
                                                    setHistory(
                                                        prev =>
                                                            prev.filter(
                                                                h =>
                                                                    h.id !==
                                                                    item.id
                                                            )
                                                    )
                                                }
                                                className="w-8 h-8 rounded-full bg-slate-100 text-slate-400 hover:bg-red-100 hover:text-red-600 transition-colors flex items-center justify-center mx-auto"
                                                title="Hapus"
                                            >

                                                <i className="fas fa-trash-alt text-xs"></i>

                                            </button>

                                        </td>

                                    </tr>

                                ))

                            )}

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    );
}


/* =========================================================
   START APP
========================================================= */

const root =
    ReactDOM.createRoot(
        document.getElementById('root')
    );

root.render(
    <AuthGate>
        <CalculatorApp />
    </AuthGate>
);

</script>

</body>
</html>
