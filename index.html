/* =========================================================
   FORMAT CURRENCY
========================================================= */

const formatRp = (value) => {

    if (
        value === null ||
        value === undefined ||
        value === ''
    ) {
        return '';
    }

    const numberString =
        value.toString().replace(/[^,\d]/g, '');

    const split = numberString.split(',');

    const sisa = split[0].length % 3;

    let rupiah = split[0].substr(0, sisa);

    const ribuan =
        split[0].substr(sisa).match(/\d{3}/gi);

    if (ribuan) {

        const separator = sisa ? '.' : '';

        rupiah +=
            separator +
            ribuan.join('.');

    }

    return split[1] !== undefined
        ? rupiah + ',' + split[1]
        : rupiah;
};


const unformatRp = (value) => {

    if (!value) return 0;

    if (typeof value === 'number') {
        return value;
    }

    return parseInt(
        value.replace(/[^,\d]/g, '') || 0,
        10
    );
};


const formatCurrency = (val) => {

    return new Intl.NumberFormat('id-ID', {
        style: 'currency',
        currency: 'IDR',
        minimumFractionDigits: 0,
        maximumFractionDigits: 0
    }).format(val || 0);

};

function CalculatorApp() {

    const [activeTab, setActiveTab] =
        useState('ideal');


    /* BASIC */

    const [productName, setProductName] =
        useState('');

    const [hpp, setHpp] =
        useState('');

    const [targetProfit, setTargetProfit] =
        useState('');

    const [sellingPrice, setSellingPrice] =
        useState('');


    /* DISCOUNT */

    const [discountEnabled, setDiscountEnabled] =
        useState(false);

    const [discountPercent, setDiscountPercent] =
        useState('');

    const [discountOpen, setDiscountOpen] =
        useState(false);


    /* PERCENTAGE FEES */

    const [percentageFees, setPercentageFees] =
        useState([

            {
                id: 1,
                name: 'Biaya Admin',
                value: '10',
                basis: 'after'
            },

            {
                id: 2,
                name: 'Gratis Ongkir Xtra',
                value: '4',
                basis: 'after'
            },

            {
                id: 3,
                name: 'Promo Xtra+',
                value: '4',
                basis: 'after'
            }

        ]);


    /* NOMINAL FEES */

    const [nominalFees, setNominalFees] =
        useState([

            {
                id: 1,
                name: 'Biaya Packing',
                value: '2000'
            },

            {
                id: 2,
                name: 'Biaya Pemrosesan Pesanan',
                value: '1250'
            }

        ]);


    /* HISTORY */

    const [history, setHistory] =
        useState(() => {

            const savedHistory =
                localStorage.getItem(
                    'profitCalcHistory'
                );

            return savedHistory
                ? JSON.parse(savedHistory)
                : [];

        });


    const [toast, setToast] =
        useState(null);


    useEffect(() => {

        localStorage.setItem(
            'profitCalcHistory',
            JSON.stringify(history)
        );

    }, [history]);


    /*
     =========================================================
     CALCULATION ENGINE

     Konsep:

     IDEAL:
     target profit = uang bersih setelah seluruh potongan.

     Jika diskon aktif:
     - harga coret = harga sebelum diskon
     - harga jual = harga setelah diskon

     Potongan %:
     - BEFORE = dihitung dari harga coret
     - AFTER  = dihitung dari harga setelah diskon

     REAL:
     - input harga jual aktual
     - jika diskon aktif, harga jual adalah harga setelah diskon
     - tidak menampilkan harga coret di mode real
     =========================================================
    */

    const calcResult = useMemo(() => {

        const numHpp =
            unformatRp(hpp) || 0;

        const discount =
            discountEnabled
                ? Math.min(
                    Math.max(
                        parseFloat(discountPercent) || 0,
                        0
                    ),
                    99.99
                )
                : 0;


        /*
         * Total persentase biaya.
         *
         * Biaya BEFORE diskon tidak menjadi
         * koefisien terhadap harga final.
         *
         * Biaya AFTER diskon menjadi koefisien
         * terhadap harga jual setelah diskon.
         */

        let pctBefore = 0;
        let pctAfter = 0;

        percentageFees.forEach(fee => {

            const value =
                parseFloat(fee.value) || 0;

            if (fee.basis === 'before') {

                pctBefore += value / 100;

            } else {

                pctAfter += value / 100;

            }

        });


        const totalNom =
            nominalFees.reduce(
                (sum, fee) =>
                    sum +
                    (unformatRp(fee.value) || 0),
                0
            );


        /*
         * Validasi biaya AFTER.
         */

        const isError =
            pctAfter >= 1 ||
            pctBefore >= 1 ||
            discount >= 100;


        let finalSellingPrice = 0;
        let coretPrice = 0;
        let finalProfit = 0;
        let totalPotongan = 0;

        let breakdownPct = [];
        let breakdownNom = [];


        if (!isError) {

            if (activeTab === 'ideal') {

                const numTarget =
                    unformatRp(targetProfit) || 0;


                /*
                 * Kita mencari:
                 *
                 * P = harga setelah diskon
                 *
                 * Jika diskon:
                 *
                 * harga coret = P / (1-d)
                 *
                 * biaya BEFORE = coret * pctBefore
                 * biaya AFTER  = P * pctAfter
                 *
                 * profit:
                 *
                 * P - HPP
                 * - biaya before
                 * - biaya after
                 * - biaya nominal
                 *
                 * = target
                 *
                 * Jadi:
                 *
                 * P(1 - pctAfter - pctBefore/(1-d))
                 * =
                 * HPP + target + nominal
                 */

                const discountFactor =
                    1 - (discount / 100);


                const beforeCoefficient =
                    pctBefore / discountFactor;


                const denominator =
                    1 -
                    pctAfter -
                    beforeCoefficient;


                if (
                    denominator <= 0
                ) {

                    return {
                        sp: 0,
                        coret: 0,
                        profit: 0,
                        potongan: 0,
                        margin: 0,
                        isError: true,
                        breakdownPct: [],
                        breakdownNom: [],
                        errorMessage:
                            'Kombinasi diskon dan potongan terlalu besar sehingga harga jual ideal tidak dapat dihitung.'
                    };

                }


                finalSellingPrice =
                    (
                        numHpp +
                        numTarget +
                        totalNom
                    ) / denominator;


                if (discount > 0) {

                    coretPrice =
                        finalSellingPrice /
                        discountFactor;

                } else {

                    coretPrice =
                        finalSellingPrice;

                }


            } else {

                /*
                 * REAL PROFIT
                 *
                 * Harga yang dimasukkan adalah
                 * harga jual aktual / harga setelah
                 * diskon.
                 */

                finalSellingPrice =
                    unformatRp(
                        sellingPrice
                    ) || 0;


                /*
                 * Mode real tidak membutuhkan
                 * harga coret untuk kalkulasi.
                 */

                coretPrice =
                    finalSellingPrice;

            }


            /*
             * Hitung biaya percentage.
             */

            percentageFees.forEach(fee => {

                const val =
                    parseFloat(fee.value) || 0;

                if (val <= 0) return;


                let amount = 0;


                if (fee.basis === 'before') {

                    /*
                     * Jika discount aktif,
                     * basis BEFORE = harga coret.
                     *
                     * Jika discount tidak aktif,
                     * harga coret = harga jual.
                     */

                    amount =
                        coretPrice *
                        (val / 100);

                } else {

                    /*
                     * AFTER = harga jual final.
                     */

                    amount =
                        finalSellingPrice *
                        (val / 100);

                }


                breakdownPct.push({

                    name:
                        fee.name ||
                        'Biaya %',

                    pct: val,

                    amount,

                    basis: fee.basis

                });

            });


            /*
             * Biaya nominal.
             */

            nominalFees.forEach(fee => {

                const val =
                    unformatRp(
                        fee.value
                    ) || 0;

                if (val > 0) {

                    breakdownNom.push({

                        name:
                            fee.name ||
                            'Biaya Tetap',

                        amount: val

                    });

                }

            });


            totalPotongan =
                breakdownPct.reduce(
                    (sum, item) =>
                        sum + item.amount,
                    0
                ) +
                breakdownNom.reduce(
                    (sum, item) =>
                        sum + item.amount,
                    0
                );


            finalProfit =
                finalSellingPrice -
                numHpp -
                totalPotongan;

        }


        /*
         * Margin berdasarkan harga jual final.
         */

        const margin =
            finalSellingPrice > 0
                ? (
                    finalProfit /
                    finalSellingPrice
                ) * 100
                : 0;


        return {

            sp:
                finalSellingPrice,

            coret:
                coretPrice,

            profit:
                finalProfit,

            potongan:
                totalPotongan,

            margin,

            isError,

            breakdownPct,

            breakdownNom,

            errorMessage: ''

        };

    }, [

        activeTab,
        hpp,
        targetProfit,
        sellingPrice,
        percentageFees,
        nominalFees,
        discountEnabled,
        discountPercent

    ]);


    /*
     =========================================================
     TOAST
     =========================================================
    */

    const showToast = (
        text,
        type = 'error'
    ) => {

        setToast({
            text,
            type
        });

        setTimeout(
            () => setToast(null),
            3000
        );

    };


    /*
     =========================================================
     PERCENTAGE FEE
     =========================================================
    */

    const handleUpdatePctFee =
        (id, field, val) => {

            setPercentageFees(prev =>
                prev.map(fee =>
                    fee.id === id
                        ? {
                            ...fee,
                            [field]: val
                        }
                        : fee
                )
            );

        };


    const addPctFee = () => {

        setPercentageFees(prev => [

            ...prev,

            {
                id: Date.now(),
                name: '',
                value: '',
                basis: 'after'
            }

        ]);

    };


    const removePctFee = id => {

        setPercentageFees(prev =>
            prev.filter(
                fee => fee.id !== id
            )
        );

    };


    /*
     =========================================================
     NOMINAL FEE
     =========================================================
    */

    const handleUpdateNomFee =
        (id, field, val) => {

            setNominalFees(prev =>
                prev.map(fee =>
                    fee.id === id
                        ? {
                            ...fee,
                            [field]: val
                        }
                        : fee
                )
            );

        };


    const addNomFee = () => {

        setNominalFees(prev => [

            ...prev,

            {
                id: Date.now(),
                name: '',
                value: ''
            }

        ]);

    };


    const removeNomFee = id => {

        setNominalFees(prev =>
            prev.filter(
                fee => fee.id !== id
            )
        );

    };


    /*
     =========================================================
     SAVE
     =========================================================
    */

    const handleSave = () => {

        if (
            !productName ||
            unformatRp(hpp) === 0
        ) {

            showToast(
                'Nama Produk dan Modal (HPP) wajib diisi!',
                'error'
            );

            return;

        }


        if (
            activeTab === 'ideal' &&
            unformatRp(targetProfit) === 0
        ) {

            showToast(
                'Target Keuntungan Bersih wajib diisi.',
                'error'
            );

            return;

        }


        if (
            activeTab === 'real' &&
            unformatRp(sellingPrice) === 0
        ) {

            showToast(
                'Harga Jual Saat Ini wajib diisi.',
                'error'
            );

            return;

        }


        if (calcResult.isError) {

            showToast(
                calcResult.errorMessage ||
                'Kalkulasi tidak valid.',
                'error'
            );

            return;

        }


        const newItem = {

            id: Date.now(),

            name:
                productName,

            mode:
                activeTab,

            hpp:
                unformatRp(hpp),

            sp:
                calcResult.sp,

            coret:
                discountEnabled &&
                activeTab === 'ideal'
                    ? calcResult.coret
                    : 0,

            discountEnabled:
                activeTab === 'ideal'
                    ? discountEnabled
                    : false,

            discountPercent:
                activeTab === 'ideal'
                    ? (
                        parseFloat(
                            discountPercent
                        ) || 0
                    )
                    : 0,

            potongan:
                calcResult.potongan,

            profit:
                calcResult.profit,

            margin:
                calcResult.margin

        };


        setHistory(prev => [
            newItem,
            ...prev
        ]);


        showToast(
            'Berhasil disimpan ke tabel riwayat!',
            'success'
        );

    };


    const isProfit =
        calcResult.profit > 0;

    const isLoss =
        calcResult.profit < 0;


    return (

        <div className="max-w-6xl mx-auto p-4 md:p-6 lg:p-8 pt-8">


            {/* =================================================
                TOAST
            ================================================= */}

            {toast && (

                <div className={`fixed top-5 left-4 right-4 sm:left-auto sm:right-6 sm:w-auto z-50 px-5 py-3 rounded-xl shadow-lg flex items-center gap-3 ${
                    toast.type === 'error'
                        ? 'bg-red-600'
                        : 'bg-emerald-600'
                } text-white`}>

                    <i className={`fas ${
                        toast.type === 'error'
                            ? 'fa-exclamation-circle'
                            : 'fa-check-circle'
                    } text-xl`}></i>

                    <p className="font-medium">
                        {toast.text}
                    </p>

                </div>

            )}


            {/* =================================================
                HEADER
            ================================================= */}

            <header className="mb-8 text-center lg:text-left flex flex-col lg:flex-row items-center justify-between gap-4">

                <div>

                    <h1 className="text-2xl md:text-3xl font-bold text-slate-900 flex items-center gap-3 justify-center lg:justify-start">

                        <i className="fas fa-calculator text-indigo-600"></i>

                        Kalkulator Profit MP

                    </h1>

                    <p className="text-slate-500 mt-1">
                        Hitung Harga Jual AKURAT, Supaya UNTUNG Bukan BUNTUNG!
                    </p>

                </div>

            </header>


            <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">


                {/* =================================================
                    LEFT
                ================================================= */}

                <div className="lg:col-span-2 space-y-6">


                    {/* =================================================

                                    >

                                        <i className="fas fa-folder-open text-4xl mb-3 block opacity-50"></i>

                                        Belum ada data kalkulasi yang disimpan.

                                    </td>

                                </tr>

                            ) : (

                                history.map(item => (

                                    <tr
                                        key={item.id}
                                        className="border-b border-slate-100 hover:bg-slate-50/80 transition-colors"
                                    >

                                        <td className="px-5 py-4 font-bold text-slate-800">

                                            {item.name}

                                            <div className="text-[10px] font-normal text-slate-400 mt-0.5 uppercase tracking-wider">

                                                Mode:
                                                {' '}
                                                {item.mode === 'ideal'
                                                    ? 'Hitung Ideal'
                                                    : 'Cek Real'
                                                }

                                            </div>

                                        </td>


                                        <td className="px-5 py-4 text-slate-600">

                                            {formatCurrency(
                                                item.hpp
                                            )}

                                        </td>


                                        <td className="px-5 py-4 font-semibold text-slate-800">

                                            {formatCurrency(
                                                item.sp
                                            )}

                                            {item.discountEnabled &&
                                                item.discountPercent > 0 && (

                                                <div className="text-[10px] text-indigo-500 font-semibold mt-0.5">

                                                    Diskon {item.discountPercent}%

                                                </div>

                                            )}

                                        </td>


                                        <td className="px-5 py-4">

                                            {item.discountEnabled &&
                                                item.coret > 0 ? (

                                                <span className="text-slate-400 line-through">

                                                    {formatCurrency(
                                                        item.coret
                                                    )}

                                                </span>

                                            ) : (

                                                <span className="text-slate-300">
                                                    —
                                                </span>

                                            )}

                                        </td>


                                        <td className="px-5 py-4 font-semibold text-red-500">

                                            - {formatCurrency(
                                                item.potongan
                                            )}

                                        </td>


                                        <td className="px-5 py-4">

                                            <div className={`font-black ${
                                                item.profit > 0
                                                    ? 'text-emerald-500'
                                                    : 'text-red-500'
                                            }`}>

                                                {formatCurrency(
                                                    item.profit
                                                )}

                                            </div>

                                            <div className="text-[11px] font-medium text-slate-400 mt-0.5">

                                                Margin:
                                                {' '}
                                                {item.margin.toFixed(1)}%

                                            </div>

                                        </td>


                                        <td className="px-5 py-4 text-center">

                                            <span className={`px-3 py-1.5 text-[10px] font-bold rounded-lg uppercase tracking-wide ${
                                                item.profit > 0
                                                    ? 'bg-emerald-100 text-emerald-700'
                                                    : 'bg-red-100 text-red-700'
                                            }`}>

                                                {item.profit > 0
                                                    ? 'UNTUNG'
                                                    : 'BUNTUNG'
                                                }

                                            </span>

                                        </td>


                                        <td className="px-5 py-4 text-center">

                                            <button
                                                onClick={() =>
                                                    setHistory(
                                                        history.filter(
                                                            h =>
                                                                h.id !==
                                                                item.id
                                                        )
                                                    )
                                                }
                                                className="w-8 h-8 rounded-full bg-slate-100 text-slate-400 hover:bg-red-100 hover:text-red-600 transition-colors flex items-center justify-center mx-auto"
                                                title="Hapus"
                                            >

                                                <i className="fas fa-trash-alt text-xs"></i>

                                            </button>

                                        </td>

                                    </tr>

                                ))

                            )}

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    );

}


/* =========================================================
   RENDER
========================================================= */

const root =
    ReactDOM.createRoot(
        document.getElementById('root')
    );

root.render(
    <AuthGate>
        <CalculatorApp />
    </AuthGate>
);

</script>

</body>
</html>
